name: ethernity-php

services:
  ethernity-app:
    build:
      context: .
      dockerfile: php.Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    container_name: ethernity-app
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
    ports:
      - "5173:5173"
    networks:
      - ethernity_network
    depends_on:
      ethernity-db:
        condition: service_healthy
      ethernity-mailpit:
        condition: service_started

  ethernity-queue-worker:
    build:
      context: .
      dockerfile: php.Dockerfile
      args:
        USER_ID: 1000
        GROUP_ID: 1000
    container_name: ethernity-queue-worker
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
    command: php artisan queue:work --tries=3 --sleep=3
    networks:
      - ethernity_network
    depends_on:
      ethernity-db:
        condition: service_healthy
    restart: unless-stopped

  ethernity-webserver:
    image: nginx:alpine
    container_name: ethernity-webserver
    volumes:
      - ../:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ethernity_network
    depends_on:
      ethernity-app:
        condition: service_started
    ports:
      - "8000:80"

  ethernity-db:
    image: postgres:17-alpine
    container_name: ethernity-db
    volumes:
      - ethernity_pgdata:/var/lib/postgresql/data
      - ./postgres/init-test-db.sql:/docker-entrypoint-initdb.d/01-init-test-db.sql:ro
    networks:
      - ethernity_network
    environment:
      POSTGRES_DB: ethernity
      POSTGRES_USER: ethernity
      POSTGRES_PASSWORD: ethernity_secret
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ethernity -d ethernity"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  ethernity-mailpit:
    image: axllent/mailpit:latest
    container_name: ethernity-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - ethernity_network

  ethernity-minio:
    image: minio/minio:latest
    container_name: ethernity-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ethernity_miniodata:/data
    networks:
      - ethernity_network
    environment:
      MINIO_ROOT_USER: ethernity
      MINIO_ROOT_PASSWORD: ethernity_password
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  ethernity_network:
    driver: bridge

volumes:
  ethernity_pgdata:
  ethernity_miniodata:
